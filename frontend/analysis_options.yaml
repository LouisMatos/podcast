# Configuração do analisador estático. Rode com `flutter analyze`.
include: package:flutter_lints/flutter.yaml

# riverpod_lint 3.x (analysis_server_plugin nativo, sem custom_lint).
plugins:
  riverpod_lint:
    version: ^3.1.9
    diagnostics:
      # Só usamos `overrideWithValue` pra bootstrap (main.dart) e fakes de
      # teste — nunca scoped providers de verdade. A regra só gera ruído.
      scoped_providers_should_specify_dependencies: false

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    # Arquivos gerados por build_runner (freezed, json_serializable, riverpod, drift).
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    # Import de arquivo gerado antes de rodar o codegen não deve travar a análise.
    uri_has_not_been_generated: ignore

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_print
    - unawaited_futures
    - use_super_parameters
