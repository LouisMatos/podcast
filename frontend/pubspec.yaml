name: podcast_app
description: "Aplicativo de escuta de podcasts para Android e iOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado / MVVM
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Navegação
  go_router: ^18.0.1

  # Rede e conteúdo
  dio: ^5.11.1
  rss_dart: ^1.0.14
  intl: ^0.20.2
  # `rss_dart` não expõe o `<item>` cru — o namespace `podcast:` (capítulos)
  # e o `itunes:episodeType` ausente vs. "full" precisam do XML na mão.
  # Já vinha transitivo via `rss_dart`; agora é dependência direta.
  xml: ^6.5.0

  # Persistência local
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # Áudio
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4

  # Download
  flutter_downloader: ^1.12.1

  # Refresh em background + notificação de episódio novo (Fase 10)
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.0

  # Política "só no Wi-Fi" do auto-download (Fase 13)
  connectivity_plus: ^7.3.1

  # "Agitar pra estender o temporizador para dormir" (Fase 14)
  sensors_plus: ^6.1.1

  # UI
  google_fonts: ^8.2.1
  cached_network_image: ^4.0.0
  # Render da descrição (show notes) do episódio, que vem em HTML no RSS.
  # Dart puro (html + csslib) — não puxa analyzer/intl conflitante.
  flutter_widget_from_html_core: ^0.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  drift_dev: ^2.34.6

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

  # riverpod_lint 3.x não usa mais custom_lint — roda no analysis_server_plugin
  # nativo (analyzer >=13, compatível com drift_dev). Ativado em
  # analysis_options.yaml via `plugins:`. custom_lint segue fora (desnecessário).
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true
